repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    args: ['--maxkb=3000']
- repo: https://github.com/streetsidesoftware/cspell-cli
  rev: v10.1.0
  hooks:
  - id: cspell
    additional_dependencies:
    - "@cspell/dict-de-de"
